<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VS Code Clone</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
    crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="vscode-window">
    <nav class="titlebar">
      <div class="menu-group left-menu">
        <div class="brand"><i class="fa-brands fa-visual-studio"></i></div>
        <div class="menu-item">File</div>
        <div class="menu-item">Edit</div>
        <div class="menu-item">Selection</div>
        <div class="menu-item">View</div>
        <div class="menu-item">Go</div>
        <div class="menu-item">Run</div>
        <div class="menu-item">Terminal</div>
        <div class="menu-item">Help</div>
      </div>

      <div class="nav-center">
        <div class="nav-arrow">&larr;</div>
        <div class="nav-arrow">&rarr;</div>
        <div class="searchbar"></div>
      </div>

      <div class="window-controls">
        <span class="control">&#10761;</span>
      </div>
    </nav>

    <div class="workspace">
      <aside class="icon-bar">
        <div class="activity-icon active">
          <i class="fa-regular fa-file"></i>
        </div>
        <div class="activity-icon">
          <i class="fa-solid fa-code-branch"></i>
        </div>
        <div class="activity-icon">
          <i class="fa-regular fa-square-plus"></i>
        </div>
        <div class="activity-icon">
          <i class="fa-brands fa-github"></i>
        </div>
        <div class="activity-icon">
          <i class="fa-brands fa-python"></i>
        </div>
        <div class="activity-icon">
          <i class="fa-solid fa-ellipsis"></i>
        </div>

      </aside>

      <aside class="explorer">
        <div class="explorer-header">Explorer</div>
        <div class="tree-item root">VS Code</div>
        <div class="tree-item">style.css</div>
        <div class="tree-item">index.html</div>
      </aside>

      <main class="editor-area">


        <div class="clone">
          <iframe height="560" style="width: 100%;" scrolling="no" title="HTML, CSS, JavaScript"
            src="https://codepen.io/mawuena/embed/NWRQNay?default-tab=html%2Cresult&editable=true" frameborder="no"
            loading="lazy" allowtransparency="true">
            See the Pen <a href="https://codepen.io/mawuena/pen/NWRQNay">
              HTML, CSS, JavaScript</a> by Mawuena (<a href="https://codepen.io/mawuena">@mawuena</a>)
            on <a href="https://codepen.io">CodePen</a>.
          </iframe>
        </div>
      </main>
    </div>
  </div>
</body>

</html>
