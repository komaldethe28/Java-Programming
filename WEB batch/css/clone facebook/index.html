<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Login</title>
    <link rel="stylesheet" href="facebook.css">
</head>

<body>
    <div class="main">
        <div class="left-section">
            <div class="facebook-logo">
                <img id="img" src="https://img.magnific.com/premium-psd/facebook-transparent-icon-psd_1073073-2034.jpg?semt=ais_hybrid&w=740&q=80"
                    alt="Facebook Logo">
            </div>

            <div class="Facebook">
                <img src="facebookImg.png" alt="Facebook">
            </div>

            <div class="main-text">
                <span>Explore</span>
                <br>
                <span>the things</span>
                <br>
                <span class="text">
                    you love.
                </span>
            </div>
        </div>

        <div class="right-section">
            <div class="login-box">
                <h2>Log in to Facebook</h2>
                <form>
                    <input type="text" placeholder="Email address or mobile number">
                    <input type="password" placeholder="Password">

                    <button type="submit" class="login-btn">Log in</button>
                </form>

                <a href=" " class="forgot-password">Forgotten password?</a>

                <div class="divider"></div>

                <button class="create-btn">Create new account</button>
            </div>

        </div>

    </div>

</body>

</html>
