    <form>
        <input type="text"><br><br>
        <textarea name="message" placeholder="Enter your message"></textarea><br><br>
        <select>
            <option value="">Select state</option>
            <option value="maharashtra">Maharashtra</option>
            <option value="goa">Goa</option>
            <option value="punjab">Punjab</option>
            <option value="haryana">Haryana</option>
        </select>
        <hr />
        <h3>Choose your language:</h3>
        <label for="mar">Marathi</label>
        <input type="checkbox" id="mar"><br>
        <label for="hin">Hindi</label>
        <input type="checkbox" id="hin"><br>
        <label for="eng">English</label>
        <input type="checkbox" id="eng"><br><br>
    </form>
    <hr />
    <h3>Gender:</h3>
        <label for="male">Male</label>
        <input type="radio" id="male" name="gender">
        <label for="female">Female</label>
        <input type="radio" id="female" name="gender">
