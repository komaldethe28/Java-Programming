<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
    crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <main id="container">
        <div id="column">
            <div id="upper">
                <img src="https://i.pinimg.com/736x/9d/b2/7d/9db27d60ae66b9321f3fe35875ad4558.jpg" alt="background"
                    id="upperimg">
            </div>
            <div id="lower">
                <h2>Login</h2>
                <input type="text" placeholder="Username" id="name">
                <br>
                <input type="password" placeholder="Password" id="pass">
                <div id="options">
                    <div id="toggle"><i class="fa-solid fa-toggle-on"></i>
                    <label>Remember me</label></div>
                    <a id="forgot-pass" href="#">Forgot password?</a>
                </div>
                <button id="btn">Login</button>
                <a href="#" id="create">Create Account</a>
            </div>
        </div>
    </main>

</body>

</html>
