<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <style>
        td,
        th {
            padding: 10px;
        }
    </style>
</head>

<body>

    <table border="1" style=" border-collapse: collapse; width: 100%; text-align: center;">
        <thead>
            <tr>
                <th>Student</th>
                <th>Subject</th>
            </tr>
        </thead>

            </tr>
            <tr>

            </tr>
        </tbody>
    </table>

                <th>Product</th>
                <th>Size</th>
                <th>Price</th>

                <td>Category 1</td>

                <td>Category 2</td>

            <tr>

            </tr>
            <tr>

                <td>Shipping 4</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
